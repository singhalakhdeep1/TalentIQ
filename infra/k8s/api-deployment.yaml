apiVersion: apps/v1
kind: Deployment
metadata:
  name: talentiq-api
  namespace: talentiq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: talentiq-api
  template:
    metadata:
      labels:
        app: talentiq-api
    spec:
      containers:
        - name: api
          image: talentiq-api:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: talentiq-secrets
                  key: database-url
            - name: REDIS_URL
              value: redis://talentiq-redis:6379
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: talentiq-api
  namespace: talentiq
spec:
  selector:
    app: talentiq-api
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
