apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: talentiq-ingress
  namespace: talentiq
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.talentiq.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: talentiq-api
                port:
                  number: 4000
    - host: ai.talentiq.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: talentiq-ai-service
                port:
                  number: 8000
