apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: talentiq-neo4j
  namespace: talentiq
spec:
  serviceName: talentiq-neo4j
  replicas: 1
  selector:
    matchLabels:
      app: talentiq-neo4j
  template:
    metadata:
      labels:
        app: talentiq-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.25
          ports:
            - containerPort: 7474
            - containerPort: 7687
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: talentiq-secrets
                  key: neo4j-auth
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 15Gi
---
apiVersion: v1
kind: Service
metadata:
  name: talentiq-neo4j
  namespace: talentiq
spec:
  selector:
    app: talentiq-neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
