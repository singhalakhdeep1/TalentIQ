version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentiq-postgres
    environment:
      POSTGRES_USER: talentiq
      POSTGRES_PASSWORD: talentiq_secret
      POSTGRES_DB: talentiq
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talentiq']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talentiq-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.25-community
    container_name: talentiq-neo4j
    environment:
      NEO4J_AUTH: neo4j/talentiq_neo4j
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD', 'cypher-shell', '-u', 'neo4j', '-p', 'talentiq_neo4j', 'RETURN 1']
      interval: 15s
      timeout: 10s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: talentiq-clickhouse
    environment:
      CLICKHOUSE_USER: talentiq
      CLICKHOUSE_PASSWORD: talentiq_ch
      CLICKHOUSE_DB: talentiq_analytics
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    container_name: talentiq-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: talentiq
      MINIO_ROOT_PASSWORD: talentiq_minio
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: talentiq-api
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://talentiq:talentiq_secret@postgres:5432/talentiq
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: talentiq_neo4j
      CLICKHOUSE_URL: http://clickhouse:8123
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: super_secret_jwt_key_change_in_production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bff-web:
    build:
      context: .
      dockerfile: apps/bff-web/Dockerfile
    container_name: talentiq-bff-web
    ports:
      - '4001:4001'
    environment:
      API_URL: http://api:4000
      JWT_SECRET: super_secret_jwt_key_change_in_production
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: talentiq-web
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4001
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    depends_on:
      - bff-web
    restart: unless-stopped

  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: talentiq-ai
    ports:
      - '8000:8000'
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://talentiq:talentiq_secret@postgres:5432/talentiq
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: talentiq-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - '9092:9092'
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  clickhouse_data:
  minio_data:
  kafka_data:
